version: '3.8'

services:
  # 1. Frontend Web Dashboard (React + Leaflet + Tailwind)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - pyroguard-network
    restart: unless-stopped

  # 2. Backend REST API Gateway (Node.js + Express + TypeScript)
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=pyroguard-super-secret-jwt-key-production-2026
      - ML_SERVICE_URL=http://ml-service:8000
      - DATABASE_PATH=/app/data/pyroguard.sqlite
      - CORS_ORIGIN=*
    volumes:
      - sqlite-data:/app/data
    depends_on:
      - ml-service
    networks:
      - pyroguard-network
    restart: unless-stopped

  # 3. Machine Learning & Geospatial Service (Python 3.10 + FastAPI + scikit-learn)
  ml-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.ml
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - pyroguard-network
    restart: unless-stopped

  # 4. Optional Enterprise PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pyroguard-postgres
    environment:
      - POSTGRES_USER=pyroguard
      - POSTGRES_PASSWORD=pyroguard_secure_password
      - POSTGRES_DB=pyroguard_db
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - pyroguard-network
    restart: unless-stopped
    profiles:
      - enterprise

networks:
  pyroguard-network:
    driver: bridge

volumes:
  sqlite-data:
  pg-data:

